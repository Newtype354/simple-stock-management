name: CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

  testing:
    needs: install-dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-django pytest-playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run database migrations
        run: |
          python manage.py makemigrations --settings=ssm.settings_test
          python manage.py makemigrations stock_manager --settings=ssm.settings_test
          python manage.py migrate --settings=ssm.settings_test

      - name: Run backend tests
        run: python -m pytest -m "not e2e"

      - name: Run full test suite
        run: python -m pytest

  deployment-package:
    needs: testing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare static files and build package
        env:
          DJANGO_SECRET_KEY: 'temporary-key-for-collectstatic'
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DB_NAME: 'db.sqlite3'
          AXES_FAILURE_LIMIT: '5'
          AXES_COOLOFF_TIME: '1'
          ALLOW_PW_CHANGE: 'True'
          LOG_FILE: 'ssm.log'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python manage.py collectstatic --noinput

      - name: Deploy package to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .