name: CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

  testing:
    needs: install-dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-django pytest-playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run database migrations
        run: |
          python manage.py makemigrations --settings=ssm.settings_test
          python manage.py makemigrations stock_manager --settings=ssm.settings_test
          python manage.py migrate --settings=ssm.settings_test

      - name: Run backend tests
        run: python -m pytest -m "not e2e"

      - name: Run full test suite
        run: python -m pytest

